name: OrganizadorDeVida
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: 1
targets:
  OrganizadorDeVida:
    type: application
    platform: iOS
    sources: [OrganizadorDeVida]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.organizadordevida
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Organizador
  OrganizadorDeVidaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OrganizadorDeVidaTests]
    dependencies:
      - target: OrganizadorDeVida
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OrganizadorDeVida:
    build:
      targets:
        OrganizadorDeVida: all
    test:
      targets: [OrganizadorDeVidaTests]
